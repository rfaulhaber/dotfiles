name: Build and Cache Hosts

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push to main supersedes any in-flight build of an older commit:
# cancel the running matrix so we don't queue several full fan-outs on the
# runners. Keyed on the ref so manual dispatch and pushes share one group.
concurrency:
  group: build-and-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single source of truth for which hosts this workflow builds: reads
  # .github/hosts.json so the build matrix here and the eval matrix in
  # eval.yml can't drift apart.
  hosts:
    runs-on: nix
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Read host matrix
        id: read
        run: nu .github/scripts/read-host-matrix.nu

  # Build every host's toplevel against the exact pushed commit, natively on
  # the runner host through its nix daemon. Closures land directly in the
  # host /nix/store, where harmonia serves them to the fleet — so the first
  # deploy after a merge pulls from cache instead of rebuilding. The host
  # store doubles as the warm cache between runs; unlike the old
  # containerized Forgejo setup there is no per-job store to seed and no
  # closure copying afterwards.
  #
  # x86_64 hosts build on vulcan (`nix` label); aarch64 hosts on prometheus
  # (`nix-aarch64`). Job concurrency is bounded by the number of runner
  # instances each host registers (modules.services.github-runner.count),
  # so no max-parallel is needed here.
  build:
    runs-on: ${{ matrix.runner }}
    needs: hosts
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.hosts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # HOST via env rather than inline interpolation: matrix values come
      # from hosts.json, and quoting through the environment keeps repo
      # content out of shell syntax entirely.
      - name: Build ${{ matrix.host }}
        env:
          HOST: ${{ matrix.host }}
        run: |
          nix build ".#nixosConfigurations.${HOST}.config.system.build.toplevel" \
            --no-link --print-build-logs

  # eos is aarch64-darwin, which no fleet host can build, so it builds on a
  # GitHub-hosted macOS runner. That store is discarded with the VM: what
  # survives is the slice of the closure no public cache serves, exported as
  # a signed binary cache and handed to eos-publish below. eos substitutes it
  # from vulcan over netbird (nix/hosts/vulcan/eos-cache.nix).
  eos:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # A hosted runner has none of the fleet's nix.conf, so this restates
      # what eos needs from nix/modules/conf.nix: the experimental features
      # the flake's own code uses (`|>` in nix/lib), and nix-community, the
      # one public cache eos uses beyond cache.nixos.org. Without the cache,
      # paths eos would fetch from there get built and exported as eos-only.
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            extra-experimental-features = nix-command flakes pipe-operators

      - name: Build eos
        id: build
        shell: bash
        run: |
          system=$(nix build .#darwinConfigurations.eos.system \
            --no-link --print-out-paths --print-build-logs)
          echo "system=${system}" >> "$GITHUB_OUTPUT"

      - name: Export eos-only paths
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.EOS_CACHE_SIGNING_KEY }}
          SYSTEM: ${{ steps.build.outputs.system }}
        run: |
          if [ -z "${SIGNING_KEY}" ]; then
            echo "::error::EOS_CACHE_SIGNING_KEY is not set; the build succeeded but nothing can be published"
            exit 1
          fi
          key="${RUNNER_TEMP}/eos-cache-1.secret"
          (umask 077; printf '%s' "${SIGNING_KEY}" > "${key}")
          nix run --inputs-from . nixpkgs#nushell -- \
            .github/scripts/eos-cache-export.nu "${SYSTEM}" eos-cache "${key}"

      # NARs are zstd already; zipping them again only costs time.
      - uses: actions/upload-artifact@v7
        with:
          name: eos-cache
          path: eos-cache
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  # The `nix` label is vulcan's alone, which is where the cache is served.
  eos-publish:
    runs-on: nix
    needs: eos
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: eos-cache
          path: eos-cache

      - name: Publish to vulcan's eos cache
        run: nu .github/scripts/eos-cache-publish.nu eos-cache /var/lib/eos-cache
