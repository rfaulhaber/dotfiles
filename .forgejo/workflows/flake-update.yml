name: Flake Update and Build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes ca-derivations pipe-operators
    extra-substituters = https://install.determinate.systems https://nix-community.cachix.org https://nixos-raspberrypi.cachix.org https://niri.cachix.org
    extra-trusted-public-keys = cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964=
  # All jobs share /ci-state (bind-mounted into every job container by the
  # forgejo-runner's jobStateDir). Each workflow run gets its own subdirectory
  # to pass data (input-changes.json, per-host build reports) between jobs
  # without needing artifact actions (which require `node` in the image).
  CI_RUN_DIR: /ci-state/runs/${{ github.run_id }}

jobs:
  # Stage 1: check staleness, update flake inputs, push an update branch.
  # Matrix builds (stage 2) clone that branch so every leg sees the same
  # flake.lock. input-changes.json is dropped into CI_RUN_DIR for finalize.
  prepare:
    runs-on: nix
    outputs:
      stale: ${{ steps.check-stale.outputs.stale }}
      branch: ${{ steps.update.outputs.branch }}
      date: ${{ steps.update.outputs.date }}
    steps:
      - name: Checkout
        run: |
          PROTO="${GITHUB_SERVER_URL%%://*}"
          DOMAIN="${GITHUB_SERVER_URL#*://}"
          git clone --branch "$GITHUB_REF_NAME" \
            "${PROTO}://forgejo-actions:${GITHUB_TOKEN}@${DOMAIN}/${GITHUB_REPOSITORY}.git" .

      - name: Check if nixpkgs is stale
        id: check-stale
        run: nix run nixpkgs#nushell -- .forgejo/scripts/check-nixpkgs-stale.nu

      - name: Update inputs and push update branch
        id: update
        if: steps.check-stale.outputs.stale == 'true'
        run: nix run nixpkgs#nushell -- .forgejo/scripts/update-inputs.nu

  # Stage 2: build each host in parallel against the update branch.
  # Concurrency is bounded by the runner's `capacity` (set in vulcan's config)
  # and `max-parallel` here; whichever is lower wins. Start conservative —
  # aarch64 hosts (pallas, hecate) build via binfmt emulation on x86, which
  # is resource-hungry, so 3 in flight at a time is the safe default.
  build:
    runs-on: nix
    needs: prepare
    if: needs.prepare.outputs.stale == 'true'
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        host: [hyperion, atlas, janus, vulcan, pallas, hecate]
    steps:
      - name: Checkout update branch
        run: |
          PROTO="${GITHUB_SERVER_URL%%://*}"
          DOMAIN="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "${{ needs.prepare.outputs.branch }}" \
            "${PROTO}://forgejo-actions:${GITHUB_TOKEN}@${DOMAIN}/${GITHUB_REPOSITORY}.git" .

      - name: Build ${{ matrix.host }}
        run: nix run nixpkgs#nushell -- .forgejo/scripts/build-one-host.nu ${{ matrix.host }}

  # Stage 3: collect per-host reports from CI_RUN_DIR and create the PR.
  # Runs even when some matrix legs fail (always() + explicit prepare success
  # check) so partial failures still produce a PR flagging which hosts broke.
  finalize:
    runs-on: nix
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.stale == 'true'
    steps:
      - name: Checkout update branch
        run: |
          PROTO="${GITHUB_SERVER_URL%%://*}"
          DOMAIN="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "${{ needs.prepare.outputs.branch }}" \
            "${PROTO}://forgejo-actions:${GITHUB_TOKEN}@${DOMAIN}/${GITHUB_REPOSITORY}.git" .

      - name: Merge reports
        run: nix run nixpkgs#nushell -- .forgejo/scripts/merge-reports.nu

      - name: Create PR
        run: |
          nix run nixpkgs#nushell -- .forgejo/scripts/create-pr.nu \
            "${{ needs.prepare.outputs.branch }}" \
            "${{ needs.prepare.outputs.date }}"

      - name: Clean up run directory
        if: always()
        run: rm -rf "$CI_RUN_DIR"
